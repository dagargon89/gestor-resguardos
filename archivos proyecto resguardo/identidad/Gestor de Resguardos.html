<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gestor de Resguardos · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="layout.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="page-dashboard.jsx"></script>
<script type="text/babel" src="page-bienes.jsx"></script>
<script type="text/babel" src="page-asignaciones.jsx"></script>
<script type="text/babel" src="page-others.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#4ade80",
    "#22c55e"
  ],
  "fontSans": "IBM Plex Sans",
  "density": "balanced",
  "mode": "dark",
  "kpiVariant": "spark"
}/*EDITMODE-END*/;

const ACCENT_OPTS = [
  ['#4ade80','#22c55e'], // verde bosque
  ['#6ec1ff','#3b82f6'], // azul institucional
  ['#c9a961','#a07c2e'], // dorado
  ['#c084fc','#7c3aed'], // violeta
  ['#f5b441','#ea8a07'], // ámbar
];

const FONT_OPTS = ['IBM Plex Sans', 'Inter', 'Manrope'];

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState('dashboard');
  const [mode, setMode] = useState(t.mode || 'dark');
  const [sidebar, setSidebar] = useState('visible');
  const [showLogin, setShowLogin] = useState(false);

  useEffect(() => {
    const a = Array.isArray(t.accent) ? t.accent[0] : t.accent;
    const a2 = Array.isArray(t.accent) ? (t.accent[1] || t.accent[0]) : t.accent;
    document.documentElement.style.setProperty('--accent', a);
    document.documentElement.style.setProperty('--accent-2', a2);
    const r = parseInt(a.slice(1, 3), 16), g = parseInt(a.slice(3, 5), 16), b = parseInt(a.slice(5, 7), 16);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
    document.documentElement.style.setProperty('--accent-line', `rgba(${r},${g},${b},0.32)`);
  }, [t.accent]);

  useEffect(() => {
    document.documentElement.style.setProperty('--font-sans', `'${t.fontSans}', sans-serif`);
  }, [t.fontSans]);

  useEffect(() => { document.body.dataset.density = t.density === 'compact' ? 'compact' : t.density === 'spacious' ? 'spacious' : ''; }, [t.density]);
  useEffect(() => { document.body.dataset.mode = mode; setTweak('mode', mode); }, [mode]);

  if (showLogin) return <PageLogin onEnter={() => setShowLogin(false)}/>;

  const ctx = { route, setRoute, mode, setMode, sidebar, setSidebar };
  const Page = {
    dashboard: PageDashboard,
    bienes: PageBienes,
    asignaciones: PageAsignaciones,
    empleados: PageEmpleados,
    organizaciones: PageOrganizaciones,
    departamentos: PageDepartamentos,
    reportes: PageReportes,
    usuarios: PageUsuarios,
    configuracion: PageConfiguracion,
    portal: PagePortal,
    perfil: PagePerfil,
  }[route] || PageDashboard;

  return (
    <AppContext.Provider value={ctx}>
      <div className="app" data-sidebar={sidebar}>
        <Sidebar/>
        <div className="main">
          <Topbar/>
          <main className="content">
            <Page/>
          </main>
        </div>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Apariencia">
          <TweakColor label="Color de acento" value={t.accent} options={ACCENT_OPTS} onChange={(v) => setTweak('accent', v)}/>
          <TweakRadio label="Modo" value={mode} options={['dark','light']} onChange={(v) => setMode(v)}/>
        </TweakSection>
        <TweakSection label="Tipografía y densidad">
          <TweakSelect label="Tipografía" value={t.fontSans} options={FONT_OPTS} onChange={(v) => setTweak('fontSans', v)}/>
          <TweakRadio label="Densidad" value={t.density} options={['compact','balanced','spacious']} onChange={(v) => setTweak('density', v)}/>
        </TweakSection>
        <TweakSection label="Navegación rápida">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
            {[['login','Login'],['dashboard','Dashboard'],['bienes','Bienes'],['asignaciones','Asignaciones'],['empleados','Empleados'],['organizaciones','Organizaciones'],['departamentos','Departamentos'],['reportes','Reportes'],['usuarios','Usuarios'],['configuracion','Configuración'],['portal','Portal'],['perfil','Perfil']].map(([k, l]) => (
              <button key={k} className={`btn btn-sm ${route === k ? 'btn-primary' : ''}`} onClick={() => k === 'login' ? setShowLogin(true) : setRoute(k)} style={{ justifyContent: 'flex-start' }}>{l}</button>
            ))}
          </div>
        </TweakSection>
        <TweakSection label="Acciones">
          <TweakButton onClick={() => setShowLogin(true)} label="Ver pantalla de login"/>
          <TweakButton onClick={() => setSidebar(sidebar === 'visible' ? 'hidden' : 'visible')} label={sidebar === 'visible' ? 'Ocultar barra lateral' : 'Mostrar barra lateral'} secondary/>
        </TweakSection>
      </TweaksPanel>
    </AppContext.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
